name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project directory
        id: locate
        run: |
          PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "ERROR: package.json not found in repository!"
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "Found project in: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run build

      - name: Add Android native shell & generate HyperOS 4 icons
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          npx cap add android
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Compile Android APK
        working-directory: ${{ steps.locate.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4-Dialer-Messages-APK
          path: ${{ steps.locate.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
